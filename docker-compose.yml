services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-Laravel}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:gLh+ocUTu1ySRYnPxkTXFNJ48wSfk7dV3kLh6FoJJgw=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      RUN_MIGRATIONS: "false"
    volumes:
      # Persist SQLite database across container restarts
      - laravel_db:/var/www/html/database
      # Persist storage uploads
      - laravel_storage:/var/www/html/storage/app
    networks:
      - laravel_network

volumes:
  laravel_db:
    driver: local
  laravel_storage:
    driver: local

networks:
  laravel_network:
    driver: bridge
